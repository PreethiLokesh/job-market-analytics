server.port=8080

# ---- MongoDB connection  ----
spring.data.mongodb.uri=mongodb://localhost:27017/jobmarket

# ---- JWT ----
app.jwt.secret=change-this-secret-to-something-long-and-random-32chars-min
app.jwt.expiry-hours=24

# ---- Frontend origin allowed by CORS ----
app.cors.origin=http://localhost:5173

# ---- Number of jobs generated on first start (when the jobs collection is empty) ----
app.seed.jobs=50000
